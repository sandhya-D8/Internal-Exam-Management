<h2>Students List</h2>

<table border="1">
<tr>
<th>Name</th><th>Marks</th><th>Attendance</th><th>Result</th><th>Action</th>
</tr>

{% for s in data %}
<tr>
<td>{{s[1]}}</td>
<td>{{s[2]}}</td>
<td>{{s[3]}}</td>
<td>{{s[4]}}</td>
<td>
<a href="/edit/{{s[0]}}">Edit</a>
<a href="/delete/{{s[0]}}">Delete</a>
</td>
</tr>
{% endfor %}
</table>

<a href="/">Back</a>
