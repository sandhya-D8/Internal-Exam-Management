<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/theme.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .form-card {
            padding: 40px;
            width: 100%;
            max-width: 800px;
            position: relative;
        }
        .section-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 10px;
            margin-top: 25px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="form-card glass-container">
            <button id="theme-toggle" class="theme-toggle-btn position-absolute top-0 end-0 m-4">
                <i id="theme-icon" class="fas fa-moon"></i>
            </button>
            <h3 class="text-center mb-4"><i class="fas fa-user-edit text-warning"></i> Edit Student #{{student[0]}}</h3>
            
            <form method="POST">
                
                <div class="section-title"><i class="fas fa-id-badge text-warning me-2"></i> Basic Details</div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-id-card bg-light"></i></span>
                            <input type="text" class="form-control" value="{{student[0]}}" disabled>
                            <!-- ID is uneditable during standard edit, it stays constant -->
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" name="name" class="form-control" value="{{student[1]}}" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">Date of Birth</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-calendar-alt text-info"></i></span>
                            <input type="date" name="dob" class="form-control" value="{{student[12]}}" required>
                        </div>
                    </div>
                </div>

                <div class="section-title"><i class="fas fa-calendar-check text-success me-2"></i> Academic Period & Attendance</div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Semester</label>
                        <select name="semester" class="form-select" required>
                            <option value="1st Semester" {% if student[2] == '1st Semester' %}selected{% endif %}>1st Semester</option>
                            <option value="2nd Semester" {% if student[2] == '2nd Semester' %}selected{% endif %}>2nd Semester</option>
                            <option value="3rd Semester" {% if student[2] == '3rd Semester' %}selected{% endif %}>3rd Semester</option>
                            <option value="4th Semester" {% if student[2] == '4th Semester' %}selected{% endif %}>4th Semester</option>
                            <option value="5th Semester" {% if student[2] == '5th Semester' %}selected{% endif %}>5th Semester</option>
                            <option value="6th Semester" {% if student[2] == '6th Semester' %}selected{% endif %}>6th Semester</option>
                            <option value="7th Semester" {% if student[2] == '7th Semester' %}selected{% endif %}>7th Semester</option>
                            <option value="8th Semester" {% if student[2] == '8th Semester' %}selected{% endif %}>8th Semester</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Month</label>
                        <select name="month" class="form-select" required>
                            <option value="January" {% if student[3] == 'January' %}selected{% endif %}>January</option>
                            <option value="February" {% if student[3] == 'February' %}selected{% endif %}>February</option>
                            <option value="March" {% if student[3] == 'March' %}selected{% endif %}>March</option>
                            <option value="April" {% if student[3] == 'April' %}selected{% endif %}>April</option>
                            <option value="May" {% if student[3] == 'May' %}selected{% endif %}>May</option>
                            <option value="June" {% if student[3] == 'June' %}selected{% endif %}>June</option>
                            <option value="July" {% if student[3] == 'July' %}selected{% endif %}>July</option>
                            <option value="August" {% if student[3] == 'August' %}selected{% endif %}>August</option>
                            <option value="September" {% if student[3] == 'September' %}selected{% endif %}>September</option>
                            <option value="October" {% if student[3] == 'October' %}selected{% endif %}>October</option>
                            <option value="November" {% if student[3] == 'November' %}selected{% endif %}>November</option>
                            <option value="December" {% if student[3] == 'December' %}selected{% endif %}>December</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Attendance (%)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-percent text-success"></i></span>
                            <input type="number" name="attendance_percent" class="form-control" value="{{student[4]}}" min="0" max="100" required>
                        </div>
                    </div>
                </div>

                <div class="section-title"><i class="fas fa-graduation-cap text-warning me-2"></i> Initial Marks (Out of 100)</div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Subject 1</label>
                        <input type="number" name="sub1" class="form-control" value="{{student[5]}}" min="0" max="100" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Subject 2</label>
                        <input type="number" name="sub2" class="form-control" value="{{student[6]}}" min="0" max="100" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Subject 3</label>
                        <input type="number" name="sub3" class="form-control" value="{{student[7]}}" min="0" max="100" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Subject 4</label>
                        <input type="number" name="sub4" class="form-control" value="{{student[8]}}" min="0" max="100" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Subject 5</label>
                        <input type="number" name="sub5" class="form-control" value="{{student[9]}}" min="0" max="100" required>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-warning btn-lg"><i class="fas fa-save"></i> Update Student Record</button>
                    <a href="/edit_students" class="btn btn-light"><i class="fas fa-times"></i> Cancel</a>
                </div>
                
                <div class="d-flex justify-content-end mt-3">
                    <a href="/logout" class="btn btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
</body>
</html>
